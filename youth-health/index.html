  <h1>青少年健康</h1>
  <p class="intro">國教盟關注 15 至 24 歲青少年心理健康、自殺防治與學生健康檢查制度，推動心理評估與銜接路徑制度化，降低高風險青少年漏接風險。</p>

  <div class="article-list">
    <div class="article-card">
      <h2><a href="2025-12-05-青少年自殺通報.html">青少年自殺通報九年增加3.3倍、佔比倍增</a></h2>
      <p>15到24歲青少年自殺通報數量自104年增至113年增加3.3倍，死亡率十年增加一倍。國教行動聯盟呼籲納入心理健康評估納入學生健康檢查，建立銜接路徑降低漏接。</p>
