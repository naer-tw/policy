  <h1>校園午餐</h1>
  <p class="intro">國教盟關注學校營養午餐政策，推動「免費不等於食育力」的理念，呼籲以健康飲食教育為核心的午餐改革。</p>

  <div class="article-list">
    <div class="article-card">
      <h2><a href="2026-01-09-免費營養午餐配套.html">免費營養午餐等於食育力嗎？——國教盟呼籲三項配套讓午餐成為健康飲食教育</a></h2>
      <p>國教盟肯定免費營養午餐減輕家長負擔，但指出「免費不等於食育力」。依據《食力》2025食育力城市大調查81項指標結果，提出健康飲食品質底線、成本透明化、物價連動機制三項配套。</p>
