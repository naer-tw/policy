  <p class="intro">國教盟關注不適任教師處理制度，推動「制度要更好，不是更少」的理念，聯合全家盟、全長聯倡議校事會議改革。</p>

  <div class="article-list">
    <div class="article-card">
      <h2><a href="2026-01-23-校事會議修法.html">別讓「小案大辦」折磨老師，也別讓「大案小辦」傷害孩子——校事會議修法全紀錄</a></h2>
      <p>國教盟、全家盟、全長聯聯合倡議校事會議修法。投訴1,372件僅26案達停聘解聘（1.9%），推動分流檢舉、提升受理層級、強化外部專業三大改革。2026年1月教育部正式修法落實分流。</p>
