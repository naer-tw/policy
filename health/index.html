  <p class="intro">國教盟關注菸害防制與青少年健康，支持「由內而外」的無菸城市政策，推動符合WHO FCTC標準的健康環境。</p>

      <p>國教盟支持臺北市蔣萬安市長「無菸城市」願景，推動符合WHO FCTC第8條的「由內而外」菸害防制政策——先實現室內百分百禁菸，再規劃戶外定點吸菸。</p>
